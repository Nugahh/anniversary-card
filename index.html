<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Happy birthday Anna !</title>
<link href="https://fonts.googleapis.com/css2?family=Chewy&family=Pacifico&display=swap" rel="stylesheet">
<style>
  :root { --pink: #ff4fa3; --hot: #e0147f; --red: #e4264a; --gold: #ffd54a; }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; overflow: hidden; }
  body {
    display: grid;
    place-items: center;
    font-family: 'Chewy', 'Comic Sans MS', cursive;
    background:
      radial-gradient(circle at 20% 15%, #fff3 0 8%, transparent 30%),
      radial-gradient(circle at 80% 85%, #fff3 0 8%, transparent 30%),
      repeating-conic-gradient(#ffc2e0 0 25%, #ffd9ec 0 50%) 0 0 / 56px 56px; /* damier 90s */
  }

  /* paillettes qui scintillent (créées en JS) */
  .sparkle {
    position: fixed;
    color: #fff;
    text-shadow: 0 0 6px var(--gold), 0 0 12px #fff;
    pointer-events: none;
    animation: twinkle var(--d) ease-in-out var(--delay) infinite;
  }
  @keyframes twinkle {
    0%, 100% { opacity: 0; transform: scale(.3) rotate(0); }
    50% { opacity: 1; transform: scale(1) rotate(90deg); }
  }

  /* ---------- carte ---------- */
  .scene { perspective: 1600px; position: relative; z-index: 2; }
  .card {
    --w: min(42vw, 300px);
    position: relative;
    width: var(--w);
    aspect-ratio: 3 / 4;
    cursor: pointer;
    transform-style: preserve-3d;
    transition: transform 1s cubic-bezier(.5, 0, .2, 1);
    animation: bounce 2s ease-in-out infinite;
    -webkit-tap-highlight-color: transparent;
  }
  .card.open { transform: translateX(50%); animation: none; }
  @keyframes bounce { 0%, 100% { translate: 0 0; } 50% { translate: 0 -14px; } }

  /* page de droite (intérieur) */
  .inside {
    position: absolute; inset: 0;
    border-radius: 4px 14px 14px 4px;
    background-color: #fff;
    background-image: radial-gradient(#ffb3d6 18%, transparent 20%);
    background-size: 22px 22px;
    border: 5px solid var(--pink);
    box-shadow: 0 12px 30px #0004;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 6px; text-align: center; padding: 10px 10px 22%;
  }
  .inside h1 {
    margin: 0;
    font-size: clamp(1.5rem, 6.5vw, 2.6rem);
    line-height: 1.05;
    background: linear-gradient(90deg, var(--hot), var(--red), #ff9a3c, var(--hot));
    background-size: 300% 100%;
    -webkit-background-clip: text; background-clip: text; color: transparent;
    -webkit-text-stroke: 1px #fff;
    filter: drop-shadow(2px 2px 0 #fff) drop-shadow(0 0 6px #ff9ccf);
    animation: shine 3s linear infinite;
    opacity: 0; transform: scale(.2) rotate(-12deg);
  }
  @keyframes shine { to { background-position: 300% 0; } }
  .inside .sub {
    font-family: 'Pacifico', cursive; color: var(--hot); font-size: clamp(.9rem, 3vw, 1.2rem);
    opacity: 0;
  }
  .inside img { width: 55%; opacity: 0; transform: translateY(30px) scale(.6); }
  .card.open .inside h1 { animation: shine 3s linear infinite, pop .7s cubic-bezier(.3, 1.6, .5, 1) .7s forwards; }
  .card.open .inside .sub { animation: fade .6s ease 1.2s forwards; }
  .card.open .inside img { animation: pop-up .7s cubic-bezier(.3, 1.6, .5, 1) .9s forwards, wiggle 2s ease-in-out 1.8s infinite; }
  @keyframes pop { to { opacity: 1; transform: scale(1) rotate(-3deg); } }
  @keyframes pop-up { to { opacity: 1; transform: translateY(0) scale(1); } }
  @keyframes fade { to { opacity: 1; } }
  @keyframes wiggle { 0%, 100% { rotate: -4deg; } 50% { rotate: 4deg; } }

  .inside .oscar {
    position: absolute; right: -4px; bottom: -4px; width: 30%;
    opacity: 0; transform: translateY(40px) rotate(0);
    filter: drop-shadow(2px 0 0 #fff) drop-shadow(-2px 0 0 #fff) drop-shadow(0 2px 0 #fff) drop-shadow(0 -2px 0 #fff) drop-shadow(0 4px 6px #0005);
  }
  .inside .quote {
    position: absolute; right: 32%; bottom: 14px; width: 55%;
    font-family: 'Pacifico', cursive; font-size: clamp(.55rem, 1.9vw, .75rem); line-height: 1.3;
    color: var(--hot); text-align: right; opacity: 0; transform: rotate(-4deg);
  }
  .card.open .inside .quote { animation: fade .6s ease 1.9s forwards; }
  .card.open .inside .oscar { animation: oscar-in .7s cubic-bezier(.3, 1.6, .5, 1) 1.5s forwards; }
  @keyframes oscar-in { to { opacity: 1; transform: translateY(0) rotate(14deg); } }

  /* couverture qui pivote */
  .cover {
    position: absolute; inset: 0;
    transform-origin: left center;
    transform-style: preserve-3d;
    transition: transform 1s cubic-bezier(.5, 0, .2, 1);
  }
  .card.open .cover { transform: rotateY(-172deg); }
  .face {
    position: absolute; inset: 0;
    backface-visibility: hidden;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    box-shadow: 0 12px 30px #0004;
    border: 5px solid #fff;
    outline: 4px solid var(--pink);
  }
  .front {
    border-radius: 4px 14px 14px 4px;
    background:
      radial-gradient(circle at 25% 20%, #fff8 0 4%, transparent 5%),
      radial-gradient(circle at 75% 70%, #fff8 0 3%, transparent 4%),
      linear-gradient(160deg, #ff9ccf, #ff4fa3 55%, #e0147f);
    overflow: hidden;
  }
  .front::after { /* reflet brillant */
    content: ''; position: absolute; inset: 0;
    background: linear-gradient(115deg, transparent 35%, #fff7 50%, transparent 65%);
    background-size: 250% 100%;
    animation: gloss 3s ease-in-out infinite;
  }
  @keyframes gloss { from { background-position: 150% 0; } to { background-position: -100% 0; } }
  .front img { width: 78%; filter: drop-shadow(0 4px 0 #fff8); position: relative; z-index: 1; }
  .front .tap {
    color: #fff; font-size: clamp(1rem, 3.6vw, 1.4rem); margin-top: 6px; z-index: 1;
    text-shadow: 2px 2px 0 var(--hot); animation: pulse 1.2s ease-in-out infinite;
  }
  @keyframes pulse { 50% { transform: scale(1.12); } }
  .back {
    transform: rotateY(180deg);
    border-radius: 14px 4px 4px 14px;
    background: #fff;
    background-image: radial-gradient(#ffb3d6 18%, transparent 20%);
    background-size: 22px 22px;
  }
  .back img { width: 70%; }

  canvas { position: fixed; inset: 0; pointer-events: none; z-index: 5; }
</style>
</head>
<body>
  <div class="scene">
    <div class="card" id="card">
      <div class="inside">
        <h1>Happy<br>birthday<br>Anna !</h1>
        <div class="sub">you are the most beautiful ✨</div>
        <div class="quote">“Be yourself; everyone else is already taken”</div>
        <img class="oscar" src="images/cut/oscar.png" alt="Oscar Wilde">
      </div>
      <div class="cover">
        <div class="face front">
          <img src="images/cut/kitty-dress.png" alt="Hello Kitty">
        </div>
        <div class="face back"><img src="images/cut/kitty-glasses.png" alt=""></div>
      </div>
    </div>
  </div>
  <canvas id="confetti"></canvas>

<script>
  // --- paillettes ---
  for (let i = 0; i < 45; i++) {
    const s = document.createElement('div');
    s.className = 'sparkle';
    s.textContent = ['✦', '✧', '★', '✨'][i % 4];
    s.style.cssText = `left:${Math.random() * 100}vw;top:${Math.random() * 100}vh;` +
      `font-size:${10 + Math.random() * 22}px;--d:${1.5 + Math.random() * 2.5}s;--delay:${-Math.random() * 4}s`;
    document.body.appendChild(s);
  }

  // --- confettis ---
  const cv = document.getElementById('confetti'), ctx = cv.getContext('2d');
  const colors = ['#ff4fa3', '#e4264a', '#ffd54a', '#ffffff', '#b583ff', '#ff9ccf', '#6fd8ff'];
  let parts = [], running = false;
  const fit = () => { cv.width = innerWidth; cv.height = innerHeight; };
  fit(); addEventListener('resize', fit);

  function burst() {
    const cx = innerWidth / 2, cy = innerHeight / 2;
    for (let i = 0; i < 160; i++) {
      const a = Math.random() * Math.PI * 2, v = 6 + Math.random() * 14;
      parts.push({
        x: cx, y: cy, vx: Math.cos(a) * v, vy: Math.sin(a) * v - 6,
        size: 8 + Math.random() * 10, rot: Math.random() * 6, vr: (Math.random() - .5) * .4,
        color: colors[i % colors.length], shape: ['rect', 'heart', 'star'][i % 3], life: 0
      });
    }
    if (!running) { running = true; requestAnimationFrame(tick); }
  }

  function draw(p) {
    ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.rot); ctx.fillStyle = p.color;
    const s = p.size;
    if (p.shape === 'rect') ctx.fillRect(-s / 2, -s / 4, s, s / 2);
    else if (p.shape === 'heart') {
      ctx.beginPath(); ctx.moveTo(0, s / 3);
      ctx.bezierCurveTo(-s, -s / 3, -s / 3, -s, 0, -s / 3);
      ctx.bezierCurveTo(s / 3, -s, s, -s / 3, 0, s / 3); ctx.fill();
    } else {
      ctx.beginPath();
      for (let k = 0; k < 10; k++) {
        const r = k % 2 ? s / 4 : s / 1.6, t = k * Math.PI / 5;
        ctx.lineTo(Math.sin(t) * r, -Math.cos(t) * r);
      }
      ctx.fill();
    }
    ctx.restore();
  }

  function tick() {
    ctx.clearRect(0, 0, cv.width, cv.height);
    parts = parts.filter(p => p.y < cv.height + 30 && p.life < 300);
    for (const p of parts) {
      p.vy += .25; p.vx *= .985; p.vy *= .985;
      p.x += p.vx; p.y += p.vy; p.rot += p.vr; p.life++;
      draw(p);
    }
    if (parts.length) requestAnimationFrame(tick); else running = false;
  }

  // --- clic ---
  const card = document.getElementById('card');
  card.addEventListener('click', () => {
    const opening = card.classList.toggle('open');
    if (opening) { setTimeout(burst, 500); setTimeout(burst, 1100); }
  });
</script>
</body>
</html>
